name: Generate trophy card

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=Kreopolisz&theme=dracula&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false'
          path: dist/trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}
          version: v1.0.0

      - name: Commit and push trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to trophy.svg"
            exit 0
          fi

          git commit -m "Update GitHub trophy"
          git push